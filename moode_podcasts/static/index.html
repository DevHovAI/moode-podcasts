<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d">
<title>Podcasts & Radio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <nav id="tabs">
    <a href="#neu" data-view="neu">Neu</a>
    <a href="#podcasts" data-view="podcasts">Podcasts</a>
    <a href="#radio" data-view="radio">Radio</a>
    <a href="#entdecken" data-view="entdecken">Entdecken</a>
  </nav>
</header>

<main id="view"></main>

<!-- Mini-Player: immer sichtbar, antippen öffnet die Vollansicht -->
<footer id="mini" class="hidden">
  <div class="mini-progress"><div id="mini-bar"></div></div>
  <div class="mini-row">
    <img id="mini-cover" alt="">
    <div class="mini-text" id="mini-open">
      <div class="t" id="mini-title"></div>
      <div class="s" id="mini-sub"></div>
    </div>
    <button class="icon" id="mini-toggle" aria-label="Wiedergabe/Pause"></button>
  </div>
</footer>

<!-- Vollansicht des Players -->
<section id="sheet" class="hidden" aria-label="Player">
  <div class="sheet-head">
    <button class="icon" id="sheet-close" aria-label="Schließen">⌄</button>
    <span class="sheet-label" id="sheet-label">Jetzt läuft</span>
    <span class="icon"></span>
  </div>
  <div class="sheet-body">
    <img id="np-cover" alt="">
    <div class="np-title" id="np-title"></div>
    <div class="np-sub" id="np-sub"></div>
    <div class="np-chapter" id="np-chapter"></div>
    <div class="np-seek" id="np-seek-wrap">
      <input type="range" id="np-seek" min="0" max="1000" value="0" step="1" aria-label="Position">
      <div class="np-times"><span id="np-elapsed">0:00</span><span id="np-status"></span><span id="np-remaining">0:00</span></div>
    </div>
    <div class="np-controls">
      <button class="icon big" data-act="previous" aria-label="Zurück">⏮</button>
      <button class="icon big skip" data-skip="-30" aria-label="30 Sekunden zurück">−30</button>
      <button class="icon huge" id="np-toggle" aria-label="Wiedergabe/Pause"></button>
      <button class="icon big skip" data-skip="30" aria-label="30 Sekunden vor">+30</button>
      <button class="icon big" data-act="next" aria-label="Weiter">⏭</button>
    </div>
    <div class="np-volume"><span>🔈</span><input type="range" id="np-volume" min="0" max="100" aria-label="Lautstärke"><span>🔊</span></div>

    <div class="np-tabs">
      <button data-np="chapters" class="on">Kapitel</button>
      <button data-np="queue">Als Nächstes</button>
      <button data-np="notes">Shownotes</button>
    </div>
    <div id="np-chapters" class="np-pane"></div>
    <div id="np-queue" class="np-pane hidden"></div>
    <div id="np-notes" class="np-pane hidden notes"></div>
  </div>
</section>

<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
