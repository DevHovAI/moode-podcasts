name: Feature request
description: Something the program should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What are you trying to do that the program does not support?
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: How it should behave
      description: Describe the result, not the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
