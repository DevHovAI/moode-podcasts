name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match requirements-dev.txt, otherwise CI and a local `just check`
  # can disagree and nobody trusts the CI any more.
  RUFF_VERSION: "0.16.6"

jobs:

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ruff is a statically linked Rust binary in a wheel: no GTK, no gi,
      # nothing to compile.
      - run: pip install "ruff==${RUFF_VERSION}"

      - name: Rules
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check --diff .

  test:
    name: tests (no GTK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable, so the checkout is what gets imported. [dev] pulls the
      # pinned tools, the base install pulls the runtime dependencies the
      # tests need.
      - run: pip install -e ".[dev]"

      - name: Syntax
        run: python -m compileall -q moode_podcasts tools

      - name: Import every non-GUI module
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          failed = []
          for path in sorted(pathlib.Path("moode_podcasts").glob("*.py")):
              if path.name == "__main__.py":
                  continue
              name = f"moode_podcasts.{path.stem}"
              try:
                  importlib.import_module(name)
                  print("ok  ", name)
              except Exception as exc:
                  print("FAIL", name, type(exc).__name__, exc)
                  failed.append(name)
          sys.exit(1 if failed else 0)
          PY

      - name: pytest
        run: python -m pytest -q
